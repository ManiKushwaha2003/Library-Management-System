
{% extends "user/user_base.html" %}

{% load static %}

{% block title %}
My Profile
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-header">
        <h4>My Profile</h4>
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6">

                <label>Username</label>

                <input
                    type="text"
                    id="username"
                    class="form-control"
                    readonly
                >

            </div>

            <div class="col-md-6">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    readonly
                >

            </div>

        </div>

        <a
            href="/edit-profile/"
            class="btn btn-primary mt-3"
        >
            Edit Profile
        </a>

    </div>

</div>

{% endblock %}

{% block js %}

<script src="{% static 'js/user/user_profile.js' %}"></script>

{% endblock %}
