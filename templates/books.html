{% extends "base.html" %}
{% load static %}

{% block title %}Books{% endblock %}

{% block content %}

<div class="card">

<div class="card-header d-flex justify-content-between align-items-center">

    <h4>Books</h4>

    <div>

        <button
            class="btn btn-success me-2"
            onclick="document.getElementById('csvFile').click()">

            Upload CSV

        </button>

        <input
            type="file"
            id="csvFile"
            accept=".csv"
            style="display:none"
            onchange="uploadCSV()">

        <button
            class="btn btn-primary"
            onclick="clearForm()"
            data-bs-toggle="modal"
            data-bs-target="#bookModal">

            Add Book

        </button>

    </div>

</div>

    <div class="card-body">

        <input type="text"
               id="search"
               class="form-control mb-3"
               placeholder="Search Book...">

        <table class="table table-bordered table-hover">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Library</th>
                    <th width="180">Action</th>

                </tr>

            </thead>

            <tbody id="bookTable">

            </tbody>

        </table>

        <nav>

            <ul class="pagination justify-content-center"
                id="pagination">

            </ul>

        </nav>

    </div>

</div>


<!-- Modal -->

<div class="modal fade" id="bookModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Book

                </h5>

                <button class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input type="hidden"
                       id="bookId">

                <div class="mb-3">

                    <label>Book Name</label>

                    <input
                        type="text"
                        id="book_name"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>Author Name</label>

                    <input
                        type="text"
                        id="author_name"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>Library</label>

                    <select
                        id="library"
                        class="form-select">

                        <option value="">
                            Select Library
                        </option>

                    </select>

                </div>

                <button
                    class="btn btn-success"
                    onclick="saveBook()">

                    Save

                </button>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block js %}

<script src="{% static 'js/books.js' %}"></script>

{% endblock %}
